openapi: 3.0.3
info:
  title: Document Processing API
  version: 1.0.0

servers:
  - url: http://localhost:8000

paths:
  /documents:
    post:
      tags: [Documents]
      summary: Create a document and get upload URL
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Document created
          content:
            application/json:
              schema:
                type: object
                required: [document_id, upload_url]
                properties:
                  document_id:
                    type: string
                    format: uuid
                  upload_url:
                    type: string
                    format: uri

  /documents/{id}/process:
    post:
      tags: [Documents]
      summary: Trigger document processing
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Processing triggered
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id:
                    type: string
                    format: uuid

  /jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get job status
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Job object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /documents/{id}/artifacts:
    get:
      tags: [Artifacts]
      summary: Get document artifacts
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of artifacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artifact"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Job:
      type: object
      required:
        - id
        - document_id
        - status
        - attempts
        - max_attempts
        - created_at
      properties:
        id:
          type: string
          format: uuid

        document_id:
          type: string
          format: uuid

        status:
          type: string
          enum: [QUEUED, STARTED, COMPLETED, FAILED]

        attempts:
          type: integer
          example: 1
          description: Number of attempts performed so far

        max_attempts:
          type: integer
          example: 3
          description: Maximum retry attempts allowed

        error_message:
          type: string
          nullable: true
          description: Present only if last attempt failed

        created_at:
          type: string
          format: date-time

        queued_at:
          type: string
          format: date-time
          nullable: true

        started_at:
          type: string
          format: date-time
          nullable: true

        completed_at:
          type: string
          format: date-time
          nullable: true

        last_attempt_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of last execution attempt

    Artifact:
      type: object
      required:
        - id
        - job_id
        - type
        - download_url
        - created_at
      properties:
        id:
          type: string
          format: uuid

        job_id:
          type: string
          format: uuid

        type:
          type: string
          example: markdown

        download_url:
          type: string
          format: uri
          description: Presigned S3 URL (short-lived)

        created_at:
          type: string
          format: date-time
