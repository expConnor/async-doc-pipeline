services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: doc-pipeline-api
    command: uvicorn api.app:app --host 0.0.0.0 --port 8080 --reload
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      S3_ENDPOINT_URL: http://minio:9000
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./shared:/workspace/shared
      - ./api:/workspace/api
    depends_on:
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: python -m worker.main
    # PyMuPDF4LLM parses with ~6 native threads, so one uncapped worker
    # saturates the whole machine and extra workers just split the same CPU
    # (3 workers measured *slower* than 1). Capping each worker to one core
    # makes it a fixed unit of capacity, so throughput scales with replicas —
    # which is what ECS does in prod via per-task vCPU.
    cpus: 1
    deploy:
      replicas: 3
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      S3_ENDPOINT_URL: http://minio:9000
    env_file:
      - .env
    volumes:
      - ./shared:/workspace/shared
      - ./worker:/workspace/worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: doc-pipeline-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 10s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: doc-pipeline-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log [{console,[{level,warning}]}]
    env_file:
      - .env
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio
    container_name: doc-pipeline-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: doc-pipeline-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
