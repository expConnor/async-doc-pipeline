services:
  api:
    build: ./api
    container_name: doc-pipeline-api
    command: uvicorn app.app:app --host 0.0.0.0 --port 8080 --reload
    environment:
      POSTGRES_HOST: postgres
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./api:/api

  postgres:
    image: postgres:16
    container_name: doc-pipeline-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 10s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: doc-pipeline-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    env_file:
      - .env
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
