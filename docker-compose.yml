services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: doc-pipeline-api
    command: uvicorn api.app:app --host 0.0.0.0 --port 8080 --reload
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./shared:/workspace/shared
      - ./api:/workspace/api

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: doc-pipeline-worker
    command: python -m worker.main
    environment:
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
    env_file:
      - .env
    volumes:
      - ./shared:/workspace/shared
      - ./worker:/workspace/worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: doc-pipeline-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $POSTGRES_DB -U $POSTGRES_USER"]
      interval: 10s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: doc-pipeline-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit log [{console,[{level,warning}]}]
    env_file:
      - .env
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
