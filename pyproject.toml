[tool.poetry]
name = "doc-pipeline"
version = "0.1.0"
description = ""
authors = ["Connor R. <connorrisse@proton.me>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
sqlalchemy = ">=2.0.49,<3.0.0"
asyncpg = ">=0.31.0,<0.32.0"
aio-pika = ">=9.6.2,<10.0.0"
boto3 = ">=1.43.5,<2.0.0"
pydantic-settings = ">=2.14.0,<3.0.0"
alembic = ">=1.18.4,<2.0.0"
greenlet = ">=3.5.0,<4.0.0"
structlog = ">=24.0.0,<25.0.0"

[tool.poetry.group.api.dependencies]
fastapi = ">=0.136.1,<0.137.0"
uvicorn = ">=0.46.0,<0.47.0"

[tool.poetry.group.worker.dependencies]
pymupdf4llm = "^1.27.2.3"


[tool.poetry.group.dev.dependencies]
ruff = "*"
pytest = ">=8.0.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<1.0.0"
pytest-mock = ">=3.14.0,<4.0.0"
testcontainers = {version = ">=4.0.0,<5.0.0", extras = ["postgres"]}
moto = {version = ">=5.0.0,<6.0.0", extras = ["s3"]}
httpx = ">=0.28.0,<1.0.0"
typer = "^0.27.0"
pre-commit = "^4.6.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["local"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 80
target-version = "py313"
exclude = ["shared/migrations/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
